services:
  vrompt-nginx:
    build:
      context: .
      dockerfile: infrastructure/docker/nginx.Dockerfile
    container_name: vrompt-nginx
    restart: unless-stopped
    depends_on:
      vrompt-web:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    environment:
      VROMPT_DOMAIN: ${VROMPT_DOMAIN:?VROMPT_DOMAIN is required}
      VROMPT_TLS_CERT_PATH: ${VROMPT_TLS_CERT_PATH:?VROMPT_TLS_CERT_PATH is required}
      VROMPT_TLS_KEY_PATH: ${VROMPT_TLS_KEY_PATH:?VROMPT_TLS_KEY_PATH is required}
    volumes:
      - ${VROMPT_LETSENCRYPT_DIR:?VROMPT_LETSENCRYPT_DIR is required}:/etc/letsencrypt:ro
    networks: [edge, backend]

  vrompt-web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
    container_name: vrompt-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?SUPABASE_PUBLISHABLE_KEY is required}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?SUPABASE_SECRET_KEY is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      PAYMONGO_MODE: ${PAYMONGO_MODE:-test}
      PAYMONGO_SECRET_KEY: ${PAYMONGO_SECRET_KEY:-}
      PAYMONGO_WEBHOOK_SECRET: ${PAYMONGO_WEBHOOK_SECRET:-}
      PAYMONGO_PAYMENT_METHODS: ${PAYMONGO_PAYMENT_METHODS:-card,gcash,qrph}
      PAYMONGO_CHECKOUT_EXPIRY_HOURS: ${PAYMONGO_CHECKOUT_EXPIRY_HOURS:-24}
    expose: ['3000']
    networks: [backend]
    stop_grace_period: 20s
    healthcheck:
      test: ['CMD','node','-e',"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  edge:
  backend:
    internal: true
