services:
  vrompt-web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      target: dependencies
    container_name: vrompt-web
    command: npm run dev --workspace @vrompt/web -- --hostname 0.0.0.0 --port 3000
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3100}
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?SUPABASE_PUBLISHABLE_KEY is required}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?SUPABASE_SECRET_KEY is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      PAYMONGO_MODE: ${PAYMONGO_MODE:-test}
      PAYMONGO_SECRET_KEY: ${PAYMONGO_SECRET_KEY:-}
      PAYMONGO_WEBHOOK_SECRET: ${PAYMONGO_WEBHOOK_SECRET:-}
      PAYMONGO_PAYMENT_METHODS: ${PAYMONGO_PAYMENT_METHODS:-card,gcash,qrph}
    ports:
      - '3100:3000'
    volumes:
      - .:/workspace
      - vrompt-node-modules:/workspace/node_modules
      - vrompt-web-node-modules:/workspace/apps/web/node_modules
    healthcheck:
      test: ['CMD','node','-e',"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  vrompt-node-modules:
  vrompt-web-node-modules:
