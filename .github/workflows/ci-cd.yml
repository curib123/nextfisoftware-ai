name: Nextfi CI

on:
  pull_request:
  push:
    branches: [main, development, production]

concurrency:
  group: nextfi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test, type-check, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Verify legacy runtimes and Docker are gone
        run: |
          test ! -d apps/api
          test ! -e .dockerignore
          test ! -e docker-compose.yml
          test ! -d infrastructure/docker
          test ! -d infrastructure/vps
          test ! -d infrastructure/deploy
          test ! -d infrastructure/release
          ! grep -R "vrompt-api\|REDIS_URL\|DATABASE_URL\|docker-compose" .env*.example README.md docs .github/CI-CD.md
